<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>Supercar Dealer Tycoon - AEVITH LABS OFFICIAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            margin: 0; padding: 0;
            display: flex;
            flex-direction: column;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
        }
        #main-container {
            display: grid;
            grid-template-columns: 1fr;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        /* RESTORING YOUR EXACT BUTTON LOOK */
        .glass-button {
            width: 58px; height: 58px; border-radius: 50%;
            background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(8px);
            border: 2px solid rgba(56, 189, 248, 0.5);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: all 0.2s ease; cursor: pointer;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
        }
        .glass-button:active { transform: scale(0.9); background: rgba(56, 189, 248, 0.4); }
        
        #three-container { flex: 1; min-height: 0; }
        
        /* MOBILE ACTION STRIP FIX */
        .action-bar {
            position: fixed; bottom: 20px; left: 0; width: 100%;
            display: flex; justify-content: center; gap: 10px;
            padding: 0 10px; z-index: 1000;
            overflow-x: auto;
        }
        .top-stats { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; padding: 10px; }
    </style>
</head>
<body>
    <div class="top-stats glass-panel">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-[8px] text-slate-400 font-bold uppercase">Global Capital</p>
                <h1 id="money-display" class="text-xl font-black italic text-white">₹0</h1>
            </div>
            <div class="text-right">
                <p class="text-[8px] text-slate-400 font-bold uppercase">Diamonds</p>
                <p id="diamonds-display" class="text-cyan-400 font-black">25 💎</p>
            </div>
        </div>
    </div>

    <div id="main-container">
        <div id="three-container"></div>
        
        <div class="absolute top-24 left-1/2 -translate-x-1/2 flex items-center gap-4 bg-black/60 px-4 py-2 rounded-full border border-white/10">
            <button onclick="prevInventoryCar()" class="text-white">◀</button>
            <p id="inv-count-display" class="text-[10px] font-bold text-white">0/1 Slots</p>
            <button onclick="nextInventoryCar()" class="text-white">▶</button>
        </div>

        <div class="action-bar no-scrollbar">
            <button onclick="toggleGarageMode()" class="glass-button border-green-500">🏠<span class="text-[7px] uppercase font-bold">Garage</span></button>
            <button onclick="repair()" class="glass-button border-cyan-500">🔧<span class="text-[7px] uppercase font-bold">Repair</span></button>
            <button onclick="detail()" class="glass-button border-purple-500">✨<span class="text-[7px] uppercase font-bold">Detail</span></button>
            <button onclick="startTestDrive()" class="glass-button border-orange-500">🏎️<span class="text-[7px] uppercase font-bold">Drive</span></button>
            <button onclick="takePhoto()" class="glass-button border-white/30">📸<span class="text-[7px] uppercase font-bold">Photo</span></button>
        </div>
    </div>

    <div id="customer-modal" class="hidden fixed inset-0 flex items-center justify-center bg-black/60 z-[2000] p-6">
        <div class="glass-panel p-8 w-full max-w-sm text-center">
            <h2 id="customer-name" class="text-xl font-black uppercase text-white mb-2">New Offer</h2>
            <p id="offer-price" class="text-3xl font-black text-green-400 mb-8 italic">₹0</p>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="declineOffer()" class="bg-red-500/20 text-red-400 py-4 rounded-2xl font-bold uppercase">Decline</button>
                <button onclick="acceptOffer()" class="bg-green-500 text-white py-4 rounded-2xl font-bold uppercase shadow-lg">Accept & Sell</button>
            </div>
        </div>
    </div>

    <script>
        // --- DATA & STATE ---
        const defaultState = {
            money: 1500000, diamonds: 25, currentCarIndex: -1, slots: 1, staffCount: 0, 
            ownedCars: [], businessUpgrades: { laptop: false, lift: false, watch: false },
            inventory: [
                { name: "Meister C-Line", filename: 'cla.glb', buyPrice: 1200000, color: "#ef4444" },
                { name: "Bavarian 3-Spec", filename: '3series.glb', buyPrice: 2800000, color: "#1d4ed8" },
                { name: "Auris V8", filename: 'r812.glb', buyPrice: 6500000, color: "#f8fafc" },
                { name: "Torino Gladiator", filename: 'gallardo.glb', buyPrice: 8500000, color: "#eab308" }
            ],
            vipProfiles: [{ name: "Dubai Royal", wealth: 1.4 }, { name: "Tech Billionaire", wealth: 1.6 }]
        };
        let state = JSON.parse(localStorage.getItem('aevith_save_v3')) || defaultState;

        // --- ENGINE ---
        let scene, camera, renderer, currentModel, loader, controls;
        function init3D() {
            const container = document.getElementById('three-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(35, container.clientWidth/container.clientHeight, 0.1, 1000);
            camera.position.set(6, 2.5, 6);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.physicallyCorrectLights = true;
            container.appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const sun = new THREE.DirectionalLight(0xffffff, 2.0); sun.position.set(5,10,5); scene.add(sun);
            loader = new THREE.GLTFLoader();
            animate();
        }
        function animate() { requestAnimationFrame(animate); if(controls) controls.update(); if(renderer) renderer.render(scene, camera); }

        function updateUI() {
            document.getElementById('money-display').innerText = "₹" + Math.floor(state.money).toLocaleString('en-IN');
            document.getElementById('diamonds-display').innerText = state.diamonds + " 💎";
            document.getElementById('inv-count-display').innerText = `${state.ownedCars.length}/${state.slots} Slots`;
            localStorage.setItem('aevith_save_v3', JSON.stringify(state));
        }

        // --- BUSINESS BRIDGE ---
        function acceptOffer() {
            const bu = state.businessUpgrades || {};
            const car = state.ownedCars[state.currentCarIndex];
            let flatBonus = bu.laptop ? 5000000 : 0;
            let mult = 1.0 + (bu.lift ? 0.15 : 0) + (bu.watch ? 0.10 : 0);
            const finalPrice = (state.currentCustomer.offer * mult) + flatBonus;
            state.money += finalPrice;
            state.ownedCars.splice(state.currentCarIndex, 1);
            state.currentCarIndex = state.ownedCars.length > 0 ? 0 : -1;
            state.currentCustomer = null;
            document.getElementById('customer-modal').classList.add('hidden');
            updateUI();
            location.reload(); // Hard refresh to ensure UI state resets correctly
        }

        function buyCar(name) {
            const car = state.inventory.find(c => c.name === name);
            if (state.money >= car.buyPrice && state.ownedCars.length < state.slots) {
                state.money -= car.buyPrice;
                state.ownedCars.push({...car});
                state.currentCarIndex = state.ownedCars.length - 1;
                updateUI();
                location.reload();
            }
        }

        window.onload = () => { init3D(); updateUI(); };
    </script>
</body>
</html>
