<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Supercar Dealer Tycoon - Mobile Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');

        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* Landscape Lock Overlay */
        #orientation-overlay {
            position: fixed; inset: 0; background: #020617; z-index: 9999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; color: white; padding: 20px;
        }
        @media screen and (orientation: portrait) {
            #orientation-overlay { display: flex; }
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 50;
        }

        /* Mobile App Layout Grid */
        #main-container {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: auto 1fr 32vh; /* Top Stats | 3D View | Bottom Controls */
            height: 100dvh;
            width: 100vw;
        }

        #top-stats {
            grid-row: 1;
            padding: 1rem;
            padding-top: max(1rem, var(--safe-top));
            border-radius: 0 0 1.5rem 1.5rem;
        }

        #game-viewport {
            grid-row: 2;
            position: relative;
            overflow: hidden;
        }

        #bottom-controls {
            grid-row: 3;
            padding: 1rem;
            padding-bottom: max(1rem, var(--safe-bottom));
            border-radius: 1.5rem 1.5rem 0 0;
            display: flex;
            flex-direction: column;
        }

        .glass-button {
            width: 50px; height: 50px; border-radius: 50%;
            background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px);
            border: 2px solid rgba(56, 189, 248, 0.5);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; active: scale(0.9);
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05); color: #94a3b8;
            font-size: 10px; font-weight: 900; padding: 10px; border-radius: 10px;
            text-transform: uppercase;
        }
        .tab-btn.active { background: rgba(56, 189, 248, 0.2); color: white; border: 1px solid #38bdf8; }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* Goal & Save UI */
        #save-indicator {
            position: fixed; top: 15px; right: 15px; z-index: 100;
            background: rgba(34, 197, 94, 0.2); color: #4ade80;
            font-size: 9px; padding: 4px 10px; border-radius: 20px; opacity: 0; transition: 0.3s;
        }
    </style>
</head>
<body>

    <audio id="bg-music" src="song.mp3" loop></audio>
    <div id="save-indicator">💾 Saved</div>

    <div id="orientation-overlay">
        <div class="text-5xl mb-4">🔄</div>
        <h2 class="text-xl font-black uppercase">Rotate Device</h2>
        <p class="text-slate-400 text-sm mt-2">Landscape Mode Required</p>
    </div>

    <div id="main-container">
        <div id="top-stats" class="glass-panel">
            <div class="flex justify-between items-center mb-2">
                <div>
                    <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">Global Balance</p>
                    <h1 id="money-display" class="text-2xl font-black text-white">₹0</h1>
                </div>
                <div class="text-right">
                    <p id="brand-rep-display" class="text-[10px] text-purple-400 font-black">REP LVL 1</p>
                    <div class="flex items-center justify-end gap-1 mt-1">
                        <span class="text-xs">💎</span>
                        <p id="diamonds-display" class="text-xs text-cyan-400 font-black">25</p>
                    </div>
                </div>
            </div>
            <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                <div id="progress-bar" class="h-full bg-cyan-400" style="width: 0%"></div>
            </div>
            <div class="flex justify-between text-[9px] font-bold mt-1">
                <span id="car-name-display" class="text-slate-300 uppercase">Select Car</span>
                <span id="percent-text" class="text-cyan-400">0%</span>
            </div>
        </div>

        <div id="game-viewport">
            <div id="three-container" class="w-full h-full"></div>

            <div class="absolute right-4 top-1/2 -translate-y-1/2 flex flex-col gap-3 z-50">
                <button onclick="toggleGarageMode()" id="garage-btn" class="glass-button">
                    <span class="text-[7px] font-bold text-green-400">GARAGE</span>
                    <span>🏠</span>
                </button>
                <button onclick="repair()" class="glass-button">
                    <span class="text-[7px] font-bold text-cyan-400">REPAIR</span>
                    <span>🔧</span>
                </button>
                <button onclick="startTestDrive()" class="glass-button">
                    <span class="text-[7px] font-bold text-orange-400">DRIVE</span>
                    <span>🏎️</span>
                </button>
            </div>

            <div class="absolute top-4 left-1/2 -translate-x-1/2 flex items-center gap-6 bg-black/50 backdrop-blur px-6 py-2 rounded-full border border-white/10 z-50">
                <button onclick="prevInventoryCar()" class="text-white">◀</button>
                <p id="inv-count-display" class="text-[10px] font-black text-white">0/1</p>
                <button onclick="nextInventoryCar()" class="text-white">▶</button>
            </div>

            <div class="absolute bottom-2 w-full p-2 overflow-x-auto no-scrollbar z-50">
                <div id="market-list" class="flex gap-3"></div>
            </div>
        </div>

        <div id="bottom-controls" class="glass-panel">
            <div class="grid grid-cols-3 gap-2 mb-4">
                <button onclick="setTab('staff')" id="tab-staff" class="tab-btn active">Dealer</button>
                <button onclick="setTab('facility')" id="tab-facility" class="tab-btn">Build</button>
                <button onclick="setTab('studio')" id="tab-studio" class="tab-btn">Studio</button>
            </div>

            <div class="flex-1 overflow-y-auto no-scrollbar">
                <div id="view-staff" class="space-y-3">
                    <button onclick="hireMechanic()" class="w-full py-4 bg-white/5 border border-white/10 rounded-xl flex justify-between px-4 items-center">
                        <span class="text-xs font-black uppercase">Hire Mechanic</span>
                        <span class="text-xs text-cyan-400">₹5,00,000</span>
                    </button>
                    <button onclick="claimDaily()" class="w-full py-4 bg-cyan-600 rounded-xl text-xs font-black uppercase shadow-lg">
                        Watch Ad for ₹10,00,000
                    </button>
                </div>

                <div id="view-facility" class="hidden space-y-3 text-center">
                    <p class="text-[10px] text-slate-500 font-bold uppercase">Showroom Upgrades</p>
                    <button onclick="buySlot()" class="w-full py-4 bg-slate-800 border border-white/10 rounded-xl text-xs font-black">
                        ADD GARAGE SLOT (₹10,00,000)
                    </button>
                    <div id="branch-list" class="space-y-2"></div>
                </div>

                <div id="view-studio" class="hidden space-y-3 text-center">
                    <p class="text-[10px] text-slate-500 font-bold uppercase">Paint & Finish</p>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="setFinish('Matte')" class="py-3 bg-slate-900 border border-white/10 rounded-xl text-[10px] font-black uppercase">Matte (₹1L)</button>
                        <button onclick="setFinish('Chrome')" class="py-3 bg-cyan-900/30 border border-cyan-500/30 rounded-xl text-[10px] font-black uppercase text-cyan-400">Chrome (5💎)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="test-drive-overlay" class="fixed inset-0 bg-black/95 z-[100] hidden flex-col items-center justify-center">
        <h2 class="text-3xl font-black text-white italic mb-10">PERFECT SHIFT?</h2>
        <div class="w-72 h-6 bg-slate-800 rounded-full relative overflow-hidden border-2 border-white/20">
            <div class="absolute inset-y-0 left-[130px] w-10 bg-green-500 shadow-[0_0_20px_#22c55e]"></div>
            <div id="gauge-pointer" class="absolute inset-y-0 left-0 w-1 bg-white shadow-[0_0_10px_white]"></div>
        </div>
        <button onclick="performShift()" class="mt-12 px-16 py-6 bg-orange-500 text-white font-black rounded-2xl text-xl uppercase active:scale-95">SHIFT NOW!</button>
    </div>

    <div id="customer-modal" class="fixed inset-0 z-[100] hidden flex-items-center justify-center p-6 bg-black/60 backdrop-blur-sm">
        <div class="glass-panel w-full max-w-sm p-8 rounded-3xl text-center">
            <p id="customer-name" class="text-xs font-black text-purple-400 uppercase tracking-widest mb-2">Elite Collector</p>
            <h2 id="offer-price" class="text-4xl font-black text-green-400 mb-6">₹0</h2>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="declineOffer()" class="py-4 bg-red-500/10 text-red-400 font-black rounded-2xl uppercase text-[10px]">Decline</button>
                <button onclick="acceptOffer()" class="py-4 bg-green-500 text-white font-black rounded-2xl uppercase text-[10px] shadow-lg">Accept</button>
            </div>
        </div>
    </div>

    <script>
        // CORE LOGIC COPIED FROM INDEX.HTML TO ENSURE SYNC
        let state;
        const defaultState = {
            money: 1500000, diamonds: 25, condition: 0, currentCarIndex: -1, slots: 1, brandRep: 1, staffCount: 0, globalMult: 1.0,
            ownedCars: [], salesLog: [], inventory: [
                { name: "Meister C-Line", filename: 'cla.glb', buyPrice: 1200000, color: "#ef4444", baseHP: 180 },
                { name: "Bavarian 3-Spec", filename: '3series.glb', buyPrice: 2800000, color: "#1d4ed8", baseHP: 255 },
                { name: "Auris V8", filename: 'r812.glb', buyPrice: 6500000, color: "#f8fafc", baseHP: 430 }
            ],
            testDrive: { active: false, pointerPos: 0, direction: 1 }
        };

        function saveGame() {
            localStorage.setItem('aevith_tycoon_save_v2', JSON.stringify(state));
            const ind = document.getElementById('save-indicator');
            ind.style.opacity = '1'; setTimeout(() => ind.style.opacity = '0', 1000);
        }

        function loadGame() {
            const saved = localStorage.getItem('aevith_tycoon_save_v2');
            state = saved ? JSON.parse(saved) : defaultState;
        }

        // 3D RENDERER (Optimized for mobile)
        let scene, camera, renderer, currentModel, controls;
        function init3D() {
            const container = document.getElementById('three-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(1); // Better mobile performance
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            camera.position.set(8, 4, 8);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const light = new THREE.DirectionalLight(0xffffff, 1.2); light.position.set(5, 10, 5); scene.add(light);

            loader = new THREE.GLTFLoader();
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            renderer.render(scene, camera);
        }

        // MOBILE UX FUNCTIONS
        function setTab(tab) {
            ['staff', 'facility', 'studio'].forEach(t => {
                document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tab);
                document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
            });
        }

        function updateUI() {
            document.getElementById('money-display').innerText = "₹" + Math.floor(state.money).toLocaleString('en-IN');
            document.getElementById('inv-count-display').innerText = `${state.ownedCars.length}/${state.slots}`;

            const car = state.ownedCars[state.currentCarIndex];
            if (car) {
                document.getElementById('car-name-display').innerText = car.name;
                document.getElementById('percent-text').innerText = state.condition + "%";
                document.getElementById('progress-bar').style.width = state.condition + "%";
            }

            const market = document.getElementById('market-list');
            market.innerHTML = state.inventory.map(c => `
                <div onclick="buyCar('${c.name}')" class="min-w-[140px] glass-panel p-3 rounded-2xl flex flex-col justify-center border-white/5">
                    <p class="text-[8px] font-black text-slate-400 uppercase">${c.name}</p>
                    <p class="text-[10px] font-bold text-cyan-400 mt-1">₹${c.buyPrice/100000}L</p>
                </div>
            `).join('');
            saveGame();
        }

        // Action wrappers (Simplified for Mobile)
        function buyCar(name) {
            if (state.ownedCars.length >= state.slots) return;
            const car = state.inventory.find(c => c.name === name);
            if (state.money >= car.buyPrice) {
                state.money -= car.buyPrice;
                state.ownedCars.push({...car, condition: 30});
                state.currentCarIndex = state.ownedCars.length - 1;
                state.condition = 30;
                updateUI();
            }
        }

        function repair() {
            if (state.currentCarIndex === -1 || state.condition >= 100) return;
            state.condition = Math.min(100, state.condition + 15);
            state.ownedCars[state.currentCarIndex].condition = state.condition;
            if (navigator.vibrate) navigator.vibrate(20);
            updateUI();
        }

        window.onload = () => { loadGame(); init3D(); updateUI(); };
    </script>
</body>
</html>
