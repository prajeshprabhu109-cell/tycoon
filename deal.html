<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>Global Operations | Aevith Industries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- Necessary for Zoom/Rotate/Move -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');

        *, *::before, *::after { box-sizing: border-box; }

        body {
            background: radial-gradient(circle at top, #001219 0%, #000000 100%);
            color: #e0f2fe;
            font-family: 'Inter', sans-serif;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        .neon-border { border: 1px solid rgba(168, 85, 247, 0.3); box-shadow: 0 0 15px rgba(168, 85, 247, 0.1); }
        .glass-card { background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .chat-msg { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Fullscreen */
        #fleet-viewport:fullscreen { width: 100vw; height: 100vh; background: black; }
        #fullscreen-btn { transition: 0.2s; filter: invert(1) brightness(2); }
        #fullscreen-btn:hover { transform: scale(1.1); }

        /* ── PAGE HEADER ─────────────────────────── */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .header-left { display: flex; align-items: center; gap: 1rem; min-width: 0; }
        .back-btn {
            flex-shrink: 0;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            padding: 0.6rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        .back-btn:active { background: rgba(255,255,255,0.2); }
        .page-title {
            font-size: clamp(1.4rem, 5vw, 2.5rem);
            font-weight: 900;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: -0.03em;
            color: white;
            line-height: 1.1;
        }
        #balance-display {
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            font-weight: 900;
            color: #c084fc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .balance-box {
            background: rgba(0,0,0,0.6);
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(168,85,247,0.3);
            flex-shrink: 0;
            text-align: right;
        }

        /* ── MAIN GRID ───────────────────────────── */
        .main-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        /* ── FLEET SIDEBAR ───────────────────────── */
        #fleet-viewport {
            width: 100%;
            height: 180px;
            background: rgba(0,0,0,0.4);
            border-radius: 1rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(168,85,247,0.2);
            position: relative;
            overflow: hidden;
        }
        #fleet-viewport canvas { width: 100% !important; height: 100% !important; }

        /* ── CHAT PANEL ──────────────────────────── */
        .chat-panel {
            display: flex;
            flex-direction: column;
            height: 600px;
            border-radius: 1.5rem;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        #chat-window::-webkit-scrollbar { width: 4px; }
        #chat-window::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.4); border-radius: 2px; }

        .chat-input-row {
            padding: 1rem;
            background: rgba(0,0,0,0.6);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 0.5rem;
        }
        #chat-input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1rem;
            padding: 0.75rem 1rem;
            font-size: 0.8rem;
            color: white;
            outline: none;
            min-width: 0;
        }
        #chat-input:focus { border-color: rgba(168,85,247,0.7); }
        .pitch-btn {
            background: #7c3aed;
            padding: 0.75rem 1.25rem;
            border-radius: 1rem;
            font-weight: 900;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s;
            white-space: nowrap;
            cursor: pointer;
            border: none;
            color: white;
            flex-shrink: 0;
        }
        .pitch-btn:active { transform: scale(0.97); }

        /* ============================================
           MOBILE (≤ 768px)
        ============================================ */
        @media (max-width: 768px) {

            body { padding: 10px !important; }

            /* Header: stack vertically */
            .page-header {
                flex-direction: column !important;
                gap: 0.6rem !important;
                margin-bottom: 0.75rem !important;
            }
            .header-left { width: 100%; }
            .page-title { font-size: 1.3rem !important; }
            .balance-box {
                width: 100% !important;
                text-align: left !important;
                padding: 0.5rem 0.75rem !important;
                border-radius: 0.6rem !important;
            }
            #balance-display { font-size: 1.2rem !important; }

            /* Main grid: single column */
            .main-grid {
                grid-template-columns: 1fr !important;
                gap: 0.75rem !important;
            }

            /* Fleet sidebar: compact */
            .fleet-sidebar .glass-card { padding: 0.75rem !important; border-radius: 1rem !important; }
            #fleet-viewport { height: 140px !important; margin-bottom: 0.6rem !important; }

            /* Fleet buttons: smaller */
            .fleet-sidebar button { font-size: 8px !important; padding: 6px 8px !important; }

            /* Chat panel: fills remaining height naturally */
            .chat-panel {
                height: auto !important;
                min-height: 320px !important;
                max-height: 55vh !important;
                border-radius: 1rem !important;
            }

            /* Chat messages: tighter */
            #chat-window { padding: 0.75rem !important; gap: 0.5rem !important; }
            .chat-msg { padding: 0.6rem 0.75rem !important; border-radius: 0.75rem !important; }
            .chat-msg p.text-sm { font-size: 0.75rem !important; }

            /* Chat header bar */
            .chat-panel > div:first-child {
                padding: 0.6rem 0.75rem !important;
            }
            .chat-panel > div:first-child h3 { font-size: 0.65rem !important; }

            /* Chat buttons (hint + gift) */
            .chat-panel > div:first-child .flex.gap-2 button {
                font-size: 8px !important;
                padding: 4px 8px !important;
            }

            /* Input row */
            .chat-input-row { padding: 0.6rem !important; gap: 0.4rem !important; }
            #chat-input { padding: 0.6rem 0.75rem !important; font-size: 0.75rem !important; border-radius: 0.6rem !important; }
            .pitch-btn { padding: 0.6rem 0.9rem !important; font-size: 0.65rem !important; border-radius: 0.6rem !important; }
        }

        /* ============================================
           VERY SMALL PHONES (≤ 375px)
        ============================================ */
        @media (max-width: 375px) {
            .page-title { font-size: 1.1rem !important; }
            .chat-panel { max-height: 50vh !important; }
            .pitch-btn { padding: 0.5rem 0.7rem !important; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- HEADER -->
    <div class="max-w-7xl mx-auto page-header">
        <div class="header-left">
            <button onclick="window.location.href='buy.html'" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </button>
            <div>
                <h1 class="page-title">Global <span class="text-purple-500">Operations</span></h1>
                <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest mt-0.5">Aevith Labs International Division</p>
            </div>
        </div>
        <div class="balance-box">
            <p class="text-[9px] text-slate-500 font-black uppercase">Capital</p>
            <h2 id="balance-display">₹0</h2>
        </div>
    </div>

    <!-- MAIN LAYOUT -->
    <div class="max-w-7xl mx-auto main-grid">

        <!-- LEFT: FLEET SIDEBAR -->
        <div class="fleet-sidebar">
            <div class="glass-card p-5 rounded-3xl neon-border">
                <h3 class="text-xs font-black uppercase text-purple-400 mb-3">Strategic Fleet</h3>

                <div id="fleet-viewport" class="relative">
                    <canvas id="fleet-canvas"></canvas>
                    <button onclick="toggleFullscreen()" class="absolute top-2 right-2 z-50">
                        <img id="fullscreen-btn" src="fullscreen-icon.png" alt="Fullscreen" class="w-5 h-5 opacity-70 hover:opacity-100">
                    </button>
                    <div id="model-label" class="absolute bottom-2 left-2 text-[10px] font-black uppercase text-purple-400">Select Asset</div>
                </div>

                <div id="maintenance-menu" class="hidden space-y-2 mb-3">
                    <div class="flex justify-between gap-2">
                        <button onclick="maintain('fuel')" class="flex-1 bg-white/5 border border-white/10 py-2 rounded-lg text-[9px] font-bold hover:bg-purple-500/20">⛽ REFUEL (₹50K)</button>
                        <button onclick="maintain('repair')" class="flex-1 bg-white/5 border border-white/10 py-2 rounded-lg text-[9px] font-bold hover:bg-purple-500/20">🔧 REPAIR (₹2L)</button>
                    </div>
                </div>

                <div class="space-y-2">
                    <button onclick="previewAsset('svj')" id="btn-svj-view" class="w-full p-3 bg-purple-600 rounded-xl font-black text-[10px] uppercase hidden">Inspect Aevith SVJ</button>
                    <button onclick="previewAsset('jet')" id="btn-jet-view" class="w-full p-3 bg-purple-600 rounded-xl font-black text-[10px] uppercase hidden">Inspect Sky-Jet</button>
                    <button onclick="previewAsset('yacht')" id="btn-yacht-view" class="w-full p-3 bg-blue-600 rounded-xl font-black text-[10px] uppercase hidden">Inspect Aevith Yacht</button>
                    <button onclick="previewAsset('superyacht')" id="btn-superyacht-view" class="w-full p-3 bg-cyan-600 rounded-xl font-black text-[10px] uppercase hidden">Inspect Horizon-X Yacht</button>
                    <p id="no-assets" class="text-[9px] text-slate-500 italic text-center py-2">Acquire assets in the Executive Vault to view here.</p>
                </div>
            </div>
        </div>

        <!-- RIGHT: CHAT PANEL -->
        <div class="chat-panel glass-card">
            <div class="p-4 border-b border-white/10 flex justify-between items-center bg-black/20">
                <div class="flex items-center gap-2">
                    <div class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse flex-shrink-0"></div>
                    <h3 class="text-xs font-black uppercase tracking-widest text-white">Meeting: <span id="location-name" class="text-purple-400">Chennai HQ</span></h3>
                </div>
                <div class="flex gap-2">
                    <button onclick="buyPitchHint()" class="text-[10px] bg-blue-500/20 text-blue-400 border border-blue-500/50 px-3 py-1.5 rounded-full font-black uppercase hover:bg-blue-500 hover:text-white transition-all">Buy Hint (₹1L)</button>
                    <button onclick="giftWatch()" id="btn-gift" class="text-[10px] bg-amber-500/20 text-amber-500 border border-amber-500/50 px-3 py-1.5 rounded-full font-black uppercase hover:bg-amber-500 hover:text-black transition-all">Gift Watch</button>
                </div>
            </div>

            <div id="chat-window">
                <div class="chat-msg bg-white/5 p-4 rounded-2xl rounded-tl-none max-w-[85%] border border-white/5">
                    <p class="text-[10px] font-black text-purple-400 uppercase mb-1">Lead Investor</p>
                    <p class="text-sm leading-relaxed">Welcome. I've been monitoring Aevith Industries. What brings you to my office today?</p>
                </div>
            </div>

            <div class="chat-input-row">
                <input id="chat-input" type="text" placeholder="Say 'Hello' to your investor..." autocomplete="off">
                <button onclick="sendPitch()" class="pitch-btn">Pitch</button>
            </div>
        </div>

    </div>

    <script>
        const SAVE_KEY = 'aevith_tycoon_save_v2';
        let state = JSON.parse(localStorage.getItem(SAVE_KEY)) || { money: 1000000, globalAssets: { svj: true, jet: true, yacht: true, superyacht: true } };
        let dealStage = 0;
        let revenueMultiplier = 1.0;

        let fleetScene, fleetCamera, fleetRenderer, fleetLoader, fleetControls;

        const chatTree = {
            0: { keywords: ["hello", "hi", "hey", "good"], response: () => `Hello. Straight to the point: are you here seeking an investment for Aevith Industries, or just a social visit?`, next: 1 },
            1: { keywords: ["investor", "investment", "capital", "yes", "money"], response: () => `I thought so. Your growth is impressive, but global scale is risky. Why should I trust you with ₹500 Crore?`, next: 2 },
            2: { keywords: ["well", "profits", "revenue", "scale", "plan", "business", "good"], response: () => `Confidence is good, but numbers are better. What exactly is my ROI if I authorize this injection?`, next: 3 },
            3: { keywords: ["bugatti", "modify", "sell", "upgrades", "50%", "yacht"], response: () => `That is the aggressive vision I fund. A 50% share in your modified fleet is a fair deal. Capital is being transferred.`, next: 100 }
        };

        // PAID HINT LOGIC
        function buyPitchHint() {
            const cost = 100000;
            if(state.money >= cost) {
                state.money -= cost;
                localStorage.setItem(SAVE_KEY, JSON.stringify(state));
                updateUI();
                addMessage("Hint", "Pitch: 'My plan for scaling Aevith Industries involves acquiring high-value assets like a Bugatti or Yacht. I offer you a 50% share of generated profits to ensure ROI.'", "green");
            } else {
                addMessage("System", "INSUFFICIENT CAPITAL FOR HINT (₹1L required).", "red");
            }
        }

        function toggleFullscreen() {
            const elem = document.getElementById('fleet-viewport');
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => alert(`Error: ${err.message}`));
            } else {
                document.exitFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const container = document.getElementById('fleet-viewport');
            fleetCamera.aspect = container.clientWidth / container.clientHeight;
            fleetCamera.updateProjectionMatrix();
            fleetRenderer.setSize(container.clientWidth, container.clientHeight);
        });

        function updateUI() {
            document.getElementById('balance-display').innerText = "₹" + Math.floor(state.money).toLocaleString('en-IN');
            const ga = state.globalAssets || { svj: false, jet: false, yacht: false, superyacht: false };
            if(ga.svj) document.getElementById('btn-svj-view').classList.remove('hidden');
            if(ga.jet) document.getElementById('btn-jet-view').classList.remove('hidden');
            if(ga.yacht) document.getElementById('btn-yacht-view').classList.remove('hidden');
            if(ga.superyacht) document.getElementById('btn-superyacht-view').classList.remove('hidden');
            if(ga.svj || ga.jet || ga.yacht || ga.superyacht) document.getElementById('no-assets').classList.add('hidden');
        }

        function maintain(type) {
            const cost = type === 'fuel' ? 50000 : 200000;
            if (state.money >= cost) {
                state.money -= cost;
                localStorage.setItem(SAVE_KEY, JSON.stringify(state));
                updateUI();
                addMessage("System", `${type.toUpperCase()} COMPLETE. Balance updated.`, "green");
            } else {
                addMessage("System", "INSUFFICIENT CAPITAL.", "red");
            }
        }

        function giftWatch() {
            const btn = document.getElementById('btn-gift');
            const currentModel = fleetScene.getObjectByName('preview');
            if(currentModel) gsap.to(currentModel.rotation, { y: Math.PI * 4, duration: 1.5, ease: "back.out(1.7)" });
            revenueMultiplier = 1.5;
            btn.innerHTML = "GIFTED (1.5X BOOST)";
            btn.disabled = true;
            addMessage("System", "MOONPHASE GIFT ACCEPTED: Revenue multiplier set to 1.5x.", "green");
        }

        function initFleet3D() {
            const container = document.getElementById('fleet-viewport');
            fleetScene = new THREE.Scene();
            fleetCamera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            fleetRenderer = new THREE.WebGLRenderer({ canvas: document.getElementById('fleet-canvas'), antialias: true, alpha: true });
            fleetRenderer.setSize(container.clientWidth, container.clientHeight);

            fleetControls = new THREE.OrbitControls(fleetCamera, fleetRenderer.domElement);
            fleetControls.enableDamping = true;

            fleetLoader = new THREE.GLTFLoader();
            fleetScene.add(new THREE.AmbientLight(0xffffff, 1.5));
            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(5, 5, 5);
            fleetScene.add(pointLight);
            fleetCamera.position.set(0, 1.5, 4);
            animate();
        }

        function previewAsset(type) {
            const old = fleetScene.getObjectByName('preview');
            if(old) fleetScene.remove(old);
            let file;
            let scale = 1.0;

            switch(type) {
                case 'svj': file = 'aven.glb'; scale = 1.2; break;
                case 'jet': file = 'ces.glb'; scale = 0.8; break;
                case 'yacht': file = 'yacht1.glb'; scale = 0.5; break;
                case 'superyacht': file = 'yacht3.glb'; scale = 0.4; break;
            }

            document.getElementById('model-label').innerText = `AEVITH ${type.toUpperCase()}`;
            document.getElementById('maintenance-menu').classList.remove('hidden');

            fleetLoader.load(file, (gltf) => {
                const model = gltf.scene;
                model.name = 'preview';
                const box = new THREE.Box3().setFromObject(model);
                const center = new THREE.Vector3();
                box.getCenter(center);
                model.position.sub(center);
                model.scale.setScalar(scale);
                fleetScene.add(model);
                fleetControls.target.copy(model.position);
            });
        }

        function sendPitch() {
            const input = document.getElementById('chat-input');
            const pitch = input.value.toLowerCase();
            if(!pitch) return;
            addMessage("You", input.value, "white");
            input.value = '';
            setTimeout(() => {
                const step = chatTree[dealStage];
                if (step && step.keywords.some(k => pitch.includes(k))) {
                    addMessage("Lead Investor", step.response(), "purple");
                    dealStage = step.next;
                    if(dealStage === 100) {
                        const investment = 5000000000 * revenueMultiplier;
                        state.money += investment;
                        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
                        updateUI();
                        addMessage("System", `INVESTMENT SUCCESSFUL: ₹${(investment/10000000).toFixed(1)} Crore added.`, "green");
                    }
                } else {
                    addMessage("Lead Investor", "I'm not following. Give me a clear answer on our potential partnership.", "red");
                }
            }, 1200);
        }

        document.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') sendPitch();
        });

        function addMessage(sender, text, color) {
            const win = document.getElementById('chat-window');
            const div = document.createElement('div');
            const colorClass = color === 'green' ? 'text-green-400' : (color === 'red' ? 'text-red-400' : 'text-purple-400');
            div.className = `chat-msg bg-white/5 p-5 rounded-2xl max-w-[85%] border border-white/5 ${sender === 'You' ? 'ml-auto rounded-tr-none' : 'rounded-tl-none'}`;
            div.innerHTML = `<p class="text-[10px] font-black ${colorClass} uppercase mb-2">${sender}</p><p class="text-sm text-white">${text}</p>`;
            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
        }

        function animate() {
            requestAnimationFrame(animate);
            if(fleetControls) fleetControls.update();
            fleetRenderer.render(fleetScene, fleetCamera);
        }

        window.onload = () => { updateUI(); initFleet3D(); };
    </script>
</body>
</html>
