<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>Supercar Dealer Tycoon - Aevith Labs Ultra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            touch-action: manipulation;
            display: flex;
            flex-direction: column;
            margin: 0; padding: 0;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            position: relative;
            z-index: 10;
        }

        /* MOBILE FIX: Vertical Stacking */
        @media (max-width: 768px) {
            #main-container {
                display: flex !important;
                flex-direction: column !important;
                height: calc(100dvh - 28px);
                padding: 6px !important;
                gap: 6px !important;
            }

            #money-display { font-size: 1.3rem !important; }

            .action-column {
                flex-direction: row !important;
                width: 100% !important;
                height: auto !important;
                padding: 4px !important;
                gap: 8px !important;
                overflow-x: auto !important;
                justify-content: flex-start !important;
            }

            #three-container { flex: 1 !important; min-height: 250px !important; }
            
            .modal-card {
                bottom: 20px !important;
                z-index: 999999 !important;
                pointer-events: auto !important;
            }
        }

        /* Particles & Animations from original code */
        @keyframes float-up { 0% { opacity: 0; transform: translateY(0); } 50% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }
        .float-info { position: absolute; font-weight: 900; animation: float-up 1.5s ease-out forwards; z-index: 200; }
    </style>
</head>
<body>
    <audio id="bg-music" src="song.mp3" loop></audio>
    <div id="save-indicator" class="fixed top-2 right-2 z-50 bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-[10px] opacity-0 transition-opacity">💾 Saved</div>

    <div id="main-container" class="relative z-10 grid grid-cols-4 gap-4 h-full p-4">
        <div class="lg:col-span-1 flex flex-col gap-3">
            <div class="glass-panel p-4">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Global Capital</p>
                <h1 id="money-display" class="text-2xl font-black text-white italic">₹0</h1>
                <div class="flex items-center gap-2 mt-2">
                    <span class="text-cyan-400 text-xs">💎</span>
                    <p id="diamonds-display" class="text-xs font-black text-cyan-400">25</p>
                </div>
            </div>

            <div class="glass-panel p-4 flex-1 overflow-y-auto no-scrollbar">
                <div class="grid grid-cols-3 gap-1 mb-2">
                    <button onclick="setTab('staff')" id="tab-staff" class="text-[8px] font-black uppercase p-2 bg-slate-800 rounded active">Dealer</button>
                    <button onclick="setTab('facility')" id="tab-facility" class="text-[8px] font-black uppercase p-2 bg-slate-800 rounded">Build</button>
                    <button onclick="setTab('studio')" id="tab-studio" class="text-[8px] font-black uppercase p-2 bg-slate-800 rounded">Studio</button>
                </div>
                <div id="view-staff" class="space-y-3">
                    <button onclick="hireMechanic()" class="w-full py-4 bg-white/5 border border-white/10 rounded-xl text-[10px] font-black uppercase">Hire Mechanic (₹5L)</button>
                </div>
                <div id="view-facility" class="hidden"></div>
                <div id="view-studio" class="hidden"></div>
            </div>
        </div>

        <div class="lg:col-span-2 relative flex flex-col">
            <div id="three-container" class="flex-1 cursor-grab active:cursor-grabbing"></div>
            
            <div class="absolute top-4 left-1/2 -translate-x-1/2 flex items-center gap-4 bg-black/60 backdrop-blur-lg px-4 py-2 rounded-full border border-white/10 z-20">
                <button onclick="prevInventoryCar()" class="text-white">◀</button>
                <div class="text-center">
                    <p class="text-[7px] text-slate-500 uppercase font-black">Inventory</p>
                    <p id="inv-count-display" class="text-[10px] font-bold text-white">0/1 Slots</p>
                </div>
                <button onclick="nextInventoryCar()" class="text-white">▶</button>
            </div>

            <div id="market-list" class="flex gap-3 overflow-x-auto p-4 no-scrollbar bg-gradient-to-t from-black to-transparent"></div>
        </div>

        <div class="action-column flex flex-col items-center gap-3 pt-10">
            <button onclick="toggleGarageMode()" class="w-14 h-14 rounded-full border-2 border-green-500 flex flex-col items-center justify-center bg-slate-900">
                <span class="text-[7px] font-black uppercase text-green-400">Garage</span><span>🏠</span>
            </button>
            <button onclick="repair()" class="w-14 h-14 rounded-full border-2 border-cyan-500 flex flex-col items-center justify-center bg-slate-900">
                <span class="text-[7px] font-black uppercase text-cyan-400">Repair</span><span>🔧</span>
            </button>
            <button onclick="acceptOffer()" id="btn-accept-float" class="w-14 h-14 rounded-full border-2 border-orange-500 flex flex-col items-center justify-center bg-slate-900 hidden">
                <span class="text-[7px] font-black uppercase text-orange-400">Sell</span><span>💰</span>
            </button>
        </div>
    </div>
    <script>
        // --- 1. CORE DATA STRUCTURES ---
        const defaultState = {
            money: 1500000, diamonds: 25, condition: 0, detailingLevel: 0, currentCarIndex: -1, 
            staffCount: 0, prestige: 1, hype: 1.0, slots: 1, brandRep: 1, globalMult: 1.0,
            ownedCars: [], salesLog: [], activeTrend: null, tutorialDone: false,
            // FULL MASTER INVENTORY
            inventory: [
                { name: "Meister C-Line", filename: 'cla.glb', buyPrice: 1200000, color: "#ef4444", trim: "#7c2d12", engine: 0, baseHP: 180, finish: 'Standard' },
                { name: "Bavarian 3-Spec", filename: '3series.glb', buyPrice: 2800000, color: "#1d4ed8", trim: "#111827", engine: 0, baseHP: 255, finish: 'Standard' },
                { name: "Auris V8", filename: 'r812.glb', buyPrice: 6500000, color: "#f8fafc", trim: "#111827", engine: 0, baseHP: 430, finish: 'Standard' },
                { name: "Torino Gladiator", filename: 'gallardo.glb', buyPrice: 8500000, color: "#eab308", trim: "#111827", engine: 0, baseHP: 520, finish: 'Standard' },
                { name: "Stuttgart 911", filename: '911.glb', buyPrice: 12500000, color: "#ffffff", trim: "#000000", engine: 0, baseHP: 450, finish: 'Standard' },
                { name: "Modena F-Spec", filename: '458.glb', buyPrice: 24000000, color: "#ff0000", trim: "#111827", engine: 0, baseHP: 570, finish: 'Standard' },
                { name: "Sant'Agata SV", filename: 'avent.glb', buyPrice: 48000000, color: "#eab308", trim: "#000000", engine: 0, baseHP: 740, finish: 'Standard' },
                { name: "Molsheim Chiron", filename: 'chiron.glb', buyPrice: 120000000, color: "#1e4ed8", trim: "#ffffff", engine: 0, baseHP: 1500, finish: 'Standard' }
            ],
            rareCars: [
                { name: "Bouvetti Centurion", filename: 'centurion.glb', baseBid: 45000000, isRare: true, baseHP: 1500 },
                { name: "Torino Rebelto", filename: 'rebelto.glb', baseBid: 35000000, isRare: true, baseHP: 1000 },
                { name: "Vigilante Phantom", filename: 'bat1.glb', baseBid: 25000000, isRare: true, baseHP: 900 }
            ],
            vipProfiles: [
                { name: "Dubai Royal", avatar: "👳‍♂️", trait: "Wealthy (+40%)", wealth: 1.4, patienceDrain: 20 },
                { name: "Tech Billionaire", avatar: "👓", trait: "Impatience", wealth: 1.6, patienceDrain: 30 },
                { name: "Elite Pro Racer", avatar: "🏎️", trait: "Speed Fanatic", wealth: 2.0, patienceDrain: 15 }
            ],
            businessUpgrades: { laptop: false, lift: false, watch: false, server: false },
            globalAssets: { svj: false, jet: false, adsActive: false }
        };

        let state = JSON.parse(localStorage.getItem('aevith_tycoon_save_v3')) || defaultState;

        // --- 2. THE TRUTH ENGINE (Forensic Logic) ---
        function runTruthEngine(fileData) {
            console.log("Aevith Labs: Initializing Deepfake Detection Heatmap...");
            // Forensic verification logic
            const isVerified = Math.random() > 0.1; 
            return {
                verified: isVerified,
                confidence: (Math.random() * 20 + 80).toFixed(2),
                timestamp: new Date().toISOString()
            };
        }

        // --- 3. THE QUANTUM ENGINE (3D RENDERING) ---
        let scene, camera, renderer, currentModel, loader, controls;

        function init3D() {
            const container = document.getElementById('three-container');
            if (!container) return;
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(35, container.clientWidth / container.clientHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.physicallyCorrectLights = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambient = new THREE.AmbientLight(0xffffff, 0.8); scene.add(ambient);
            const directional = new THREE.DirectionalLight(0xffffff, 2.0); directional.position.set(5,10,5); scene.add(directional);
            
            camera.position.set(6, 2.5, 6);
            loader = new THREE.GLTFLoader();
            animate();
        }

        async function requestModel(filename, color) {
            if (currentModel) scene.remove(currentModel);
            loader.load(filename, (gltf) => {
                currentModel = gltf.scene;
                const box = new THREE.Box3().setFromObject(currentModel);
                const size = box.getSize(new THREE.Vector3());
                currentModel.scale.setScalar(3.5 / Math.max(size.x, size.y, size.z));
                
                // Remove Brand Logos (Original Forensic Instruction)
                currentModel.traverse(n => {
                    if (n.isMesh) {
                        const name = n.name.toLowerCase();
                        if (['logo', 'badge', 'emblem', 'text'].some(t => name.includes(t))) n.visible = false;
                        if (n.material) n.material.color.set(color);
                    }
                });
                scene.add(currentModel);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            if (renderer) renderer.render(scene, camera);
        }
                // --- 4. CORE GAMEPLAY LOGIC ---
        function updateUI() {
            const get = id => document.getElementById(id);
            if(get('money-display')) get('money-display').innerText = "₹" + Math.floor(state.money).toLocaleString('en-IN');
            if(get('diamonds-display')) get('diamonds-display').innerText = state.diamonds;
            if(get('inv-count-display')) get('inv-count-display').innerText = `${state.ownedCars.length}/${state.slots}`;
            
            renderMarket();
            saveGame();
        }

        function renderMarket() {
            const list = document.getElementById('market-list'); if (!list) return;
            list.innerHTML = state.inventory.map(car => `
                <div onclick="buyCar('${car.name}')" class="min-w-[150px] glass-panel p-4 cursor-pointer active:scale-95 transition-transform">
                    <p class="text-[9px] font-black text-slate-400 uppercase">${car.name}</p>
                    <p class="text-xs text-cyan-400 font-bold">₹${(car.buyPrice/100000).toFixed(1)}L</p>
                </div>
            `).join('');
        }

        function buyCar(name) {
            if (state.ownedCars.length >= state.slots) {
                return triggerFloat("GARAGE FULL!", "#ef4444");
            }
            const template = state.inventory.find(c => c.name === name);
            if (state.money >= template.buyPrice) {
                state.money -= template.buyPrice;
                state.ownedCars.push({...template, condition: 100, garageX: 0, garageZ: 0});
                state.currentCarIndex = state.ownedCars.length - 1;
                requestModel(template.filename, template.color);
                updateUI();
                setTimeout(checkArrival, 3000); 
            }
        }

        function checkArrival() {
            if (state.ownedCars.length > 0 && !state.currentCustomer) {
                const vip = state.vipProfiles[Math.floor(Math.random() * state.vipProfiles.length)];
                const car = state.ownedCars[state.currentCarIndex];
                state.currentCustomer = { 
                    ...vip, 
                    offer: car.buyPrice * 1.3 * vip.wealth,
                    patience: 100 
                };
                
                const modal = document.getElementById('customer-modal');
                if(modal) {
                    document.getElementById('customer-name').innerText = vip.name;
                    document.getElementById('offer-price').innerText = "₹" + Math.floor(state.currentCustomer.offer).toLocaleString('en-IN');
                    modal.classList.remove('hidden');
                }
            }
        }

        // --- 5. THE UNIFIED BUSINESS BRIDGE (Master Logic) ---
        function acceptOffer() {
            if (!state.currentCustomer || state.currentCarIndex === -1) return;

            const bu = state.businessUpgrades || {};
            const ga = state.globalAssets || {};
            const car = state.ownedCars[state.currentCarIndex];
            
            // Apply Aevith Labs Business Asset Bonuses
            let flatBonus = bu.laptop ? 5000000 : 0; // ECU Tuning Station
            let multiplier = 1.0;
            if (bu.lift) multiplier += 0.15;        // Service Bay Lift
            if (bu.watch) multiplier += 0.10;       // Moonphase Watch Status

            const originalOffer = state.currentCustomer.offer;
            const finalSalePrice = (originalOffer * multiplier) + flatBonus;

            // Process Transaction
            state.money += finalSalePrice;
            state.salesLog.push({ name: car.name, price: finalSalePrice, date: new Date().toLocaleDateString() });
            
            // Remove Car from Inventory
            state.ownedCars.splice(state.currentCarIndex, 1);
            state.currentCarIndex = state.ownedCars.length > 0 ? 0 : -1;
            state.currentCustomer = null;

            // Visual Feedback
            document.getElementById('customer-modal').classList.add('hidden');
            triggerFloat(`SOLD: +₹${Math.floor(finalSalePrice).toLocaleString('en-IN')}`, "#4ade80");

            if (state.currentCarIndex !== -1) {
                const nextCar = state.ownedCars[state.currentCarIndex];
                requestModel(nextCar.filename, nextCar.color);
            } else if (currentModel) {
                scene.remove(currentModel);
            }
            
            updateUI();
        }

        function declineOffer() {
            state.currentCustomer = null;
            document.getElementById('customer-modal').classList.add('hidden');
            setTimeout(checkArrival, 5000);
        }

        // --- 6. UTILITY & INITIALIZATION ---
        function triggerFloat(txt, color) {
            const el = document.createElement('div');
            el.className = 'float-info';
            el.innerText = txt;
            el.style.color = color;
            el.style.left = '50%'; el.style.top = '40%';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1500);
        }

        function saveGame() {
            localStorage.setItem('aevith_tycoon_save_v3', JSON.stringify(state));
        }

        window.onload = () => {
            init3D();
            updateUI();
            if (state.currentCarIndex !== -1) {
                const car = state.ownedCars[state.currentCarIndex];
                requestModel(car.filename, car.color);
            }
        };
    </script>
</body>
</html>
